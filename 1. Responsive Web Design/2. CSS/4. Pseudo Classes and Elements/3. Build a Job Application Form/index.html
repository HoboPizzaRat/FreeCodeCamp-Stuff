<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <h1>Job Application</h1>
        <hr>
        <form>
            <div>
                <label for="name">Full name: </label>
                <input type="text" name="name" id="name">
            </div>
            <div>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email">
            </div>
            <hr>
            <div>
                <label for="position">Position you want to apply: </label>
                <select id="position">
                    <option>Ml Engineer</option>
                    <option>Software Dev</option>
                    <option>Cybersecurity Engineer</option>
                    <option>Designer</option>
                </select>
            </div>
            <fieldset class="radio-group">
                <div>
                    <input type="radio" id="full-time" name="availability">
                    <label for="full-time">Full-Time</label>
                </div>
                <div>
                    <input type="radio" id="part-time" name="availability">
                    <label for="part-time">Part-Time</label>
                </div>
            </fieldset>
            <hr>
            <div> 
                <label for="message">Reasons why do you want to apply for this job?</label>
                <textarea id="message"></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
