<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Customer Service Ticket Form</h2>
            <section>
                <label for="name">Customer Name</label>
                <input type="text" id="name" name="name" required>
            </section>
            <section>
                <label for="email">Contact Email</label>
                <input type="email" id="email" name="email" required>
            </section>
            <section>
                <label for="customer-ticket">Short summary of the problem</label>
                <textarea id="customer-ticket" name="customer-ticket" required></textarea>
            </section>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
